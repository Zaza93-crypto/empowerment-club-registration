<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lundazi Town Council — Admin Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#063b27,#0b5d3b 55%,#d5a72c);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(430px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.logo{width:105px;height:105px;object-fit:contain;display:block;margin:0 auto 16px;border-radius:50%}
h1{text-align:center;margin:0;color:#073b28;font-size:1.45rem}
.subtitle{text-align:center;color:#667085;margin:7px 0 25px}
label{display:block;font-weight:700;color:#344054;margin:14px 0 7px}
input{width:100%;padding:13px 14px;border:1px solid #d0d5dd;border-radius:10px;font-size:1rem}
button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#0b5d3b;color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
button:disabled{opacity:.6}
.error{display:none;margin-top:14px;padding:11px;border-radius:9px;background:#fff0f0;color:#b42318}
.back{text-align:center;margin-top:18px}
.back a{color:#0b5d3b;text-decoration:none;font-weight:700}
.small{text-align:center;color:#667085;font-size:.8rem;margin-top:20px}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="/admin/lundazi-town-council-logo.jpg" alt="Lundazi Town Council">
  <h1>Lundazi Town Council</h1>
  <p class="subtitle">Empowerment Registration — Administrator Login</p>

  <form id="loginForm">
    <label for="username">Username</label>
    <input id="username" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>

    <button id="loginBtn" type="submit">Sign In</button>
    <div id="error" class="error"></div>
  </form>

  <div class="back"><a href="/">← Back to Registry</a></div>
  <div class="small">Authorised personnel only</div>
</div>

<script>
const API="https://empowerment-api.mikotembo129.workers.dev";

document.getElementById("loginForm").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const btn=document.getElementById("loginBtn");
  const error=document.getElementById("error");
  error.style.display="none";
  btn.disabled=true;
  btn.textContent="Signing in...";

  try{
    const res=await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        action:"adminLogin",
        username:document.getElementById("username").value.trim(),
        password:document.getElementById("password").value
      })
    });
    const data=await res.json();
    if(!res.ok || !data.token){
      throw new Error(data.error || "Invalid username or password.");
    }
    sessionStorage.setItem("emp_admin_token",data.token);
    sessionStorage.setItem("emp_admin_user",JSON.stringify(data.user||{}));
    window.location.href="/admin/admin.html";
  }catch(err){
    error.textContent=err.message||"Login failed.";
    error.style.display="block";
  }finally{
    btn.disabled=false;
    btn.textContent="Sign In";
  }
});
</script>
</body>
</html>
