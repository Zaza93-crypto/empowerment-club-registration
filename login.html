<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Empowerment Groups Registry</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:min(440px,100%);background:#fff;border-radius:18px;padding:32px;box-shadow:0 8px 30px #00000014;text-align:center}
.logo{width:82px;height:82px;border-radius:18px;background:#f4b400;color:#173b6c;display:grid;place-items:center;font-size:28px;font-weight:800;margin:0 auto 18px}
h1{margin:0;color:#173b6c;font-size:24px}
.subtitle{color:#6b7280;margin:7px 0 28px;font-size:14px}
.field{text-align:left;margin-bottom:16px}
label{display:block;font-weight:700;margin-bottom:7px;font-size:14px}
input{width:100%;padding:13px;border:1px solid #ccd3df;border-radius:9px;font-size:15px}
input:focus{outline:2px solid #dbe7f7;border-color:#173b6c}
button{width:100%;border:0;border-radius:9px;padding:13px;background:#173b6c;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
.error{display:none;background:#fff0f0;color:#a61b1b;border-radius:8px;padding:10px;margin-bottom:14px;font-size:13px;text-align:left}
.error.show{display:block}
.note{margin-top:18px;color:#8a93a3;font-size:12px}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">EG</div>
  <h1>Empowerment Groups Registry</h1>
  <p class="subtitle">Lundazi Town Council • Secure Login</p>

  <div id="loginError" class="error"></div>

  <form id="loginForm">
    <div class="field">
      <label for="loginUsername">Username</label>
      <input id="loginUsername" autocomplete="username" required autofocus>
    </div>

    <div class="field">
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required>
    </div>

    <button id="loginButton" type="submit">LOGIN</button>
  </form>

  <div class="note">Authorised personnel only.</div>
</div>

<script>
const API_URL = "https://empowerment-api.mikotembo129.workers.dev";

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const errorBox = document.getElementById("loginError");

function showError(message){
  errorBox.textContent = message;
  errorBox.classList.add("show");
}

form.addEventListener("submit", async function(e){
  e.preventDefault();
  errorBox.classList.remove("show");
  button.disabled = true;
  button.textContent = "AUTHENTICATING...";

  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value;

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        action: "adminLogin",
        username,
        password
      })
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok || !data.token) {
      throw new Error(data.error || "Invalid username or password.");
    }

    sessionStorage.setItem("empowermentAdminToken", data.token);
    sessionStorage.setItem("empowermentAdminUser", JSON.stringify(data.user || {}));

    // Keep the old flags only for compatibility with older pages.
    localStorage.setItem("empowermentLoggedIn", "true");
    localStorage.setItem("isLoggedIn", "true");

    window.location.replace("index.html");
  } catch (error) {
    showError(error.message || "Login failed. Please try again.");
    document.getElementById("loginPassword").value = "";
    document.getElementById("loginPassword").focus();
  } finally {
    button.disabled = false;
    button.textContent = "LOGIN";
  }
});
</script>
</body>
</html>
