<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Empowerment Groups Registry</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:min(440px,100%);background:#fff;border-radius:18px;padding:32px;box-shadow:0 8px 30px #00000014;text-align:center}
.logo{width:82px;height:82px;border-radius:18px;background:#f4b400;color:#173b6c;display:grid;place-items:center;font-size:28px;font-weight:800;margin:0 auto 18px}
h1{margin:0;color:#173b6c;font-size:24px}
.subtitle{color:#6b7280;margin:7px 0 28px;font-size:14px}
.field{text-align:left;margin-bottom:16px}
label{display:block;font-weight:700;margin-bottom:7px;font-size:14px}
input{width:100%;padding:13px;border:1px solid #ccd3df;border-radius:9px;font-size:15px}
input:focus{outline:2px solid #dbe7f7;border-color:#173b6c}
button{width:100%;border:0;border-radius:9px;padding:13px;background:#173b6c;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
button:hover{opacity:.94}
.error{display:none;background:#fff0f0;color:#a61b1b;border-radius:8px;padding:10px;margin-bottom:14px;font-size:13px}
.error.show{display:block}
.note{margin-top:18px;color:#8a93a3;font-size:12px}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">EG</div>
  <h1>Empowerment Groups Registry</h1>
  <p class="subtitle">Lundazi Town Council • Secure Login</p>
  <div id="loginError" class="error">Incorrect username or password.</div>
  <form onsubmit="login(event)">
    <div class="field">
      <label for="loginUsername">Username</label>
      <input id="loginUsername" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit">LOGIN</button>
  </form>
  <div class="note">Authorised personnel only.</div>
</div>
<script>
const LOGIN_USERNAME='admin';
const LOGIN_PASSWORD='Admin@123';
function login(e){
  e.preventDefault();
  const u=document.getElementById('loginUsername').value.trim();
  const p=document.getElementById('loginPassword').value;
  const err=document.getElementById('loginError');
  if(u===LOGIN_USERNAME && p===LOGIN_PASSWORD){
    localStorage.setItem('empowermentRegistryLoggedIn','true');
    localStorage.setItem('empowermentLoggedIn','true');
    localStorage.setItem('isLoggedIn','true');
    window.location.replace('../index.html');
  }else{
    err.classList.add('show');
    document.getElementById('loginPassword').value='';
    document.getElementById('loginPassword').focus();
  }
}
</script>
</body>
</html>
